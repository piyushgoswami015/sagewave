services:
  - type: web
    name: sagewave
    runtime: docker
    plan: free
    envVars:
      - key: PORT
        value: "3000"
      - key: NEXTAUTH_SECRET
        generateValue: true
      - key: NEXTAUTH_URL
        sync: false
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: GOOGLE_CLIENT_SECRET
        sync: false
